id: suspected_pulmonary_embolism
version: 0.1.0
title: Suspected pulmonary embolism
status: needs_local_validation
sources:
  - organization: ACR
    title: Suspected Pulmonary Embolism
    url: https://acsearch.acr.org/docs/69404/Narrative/
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains_any: ["embolie pulmonaire", "pulmonary embol"]}
    - {field: current_problem.suspected_diagnosis, contains_token: "EP"}
questions:
  - id: pretest_probability
    field: current_problem.pe_pretest_probability
    question: "Quelle est la probabilité clinique pré-test d'EP (faible/intermédiaire/élevée ou score utilisé) ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "Determines D-dimer interpretation and whether imaging is necessary."
  - id: d_dimer
    field: labs.d_dimer
    question: "D-dimères disponibles et interprétables dans ce contexte ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "A negative result with low or intermediate pretest probability may avoid imaging."
  - id: pregnancy
    field: imaging_safety.pregnancy
    question: "Une grossesse est-elle possible ou en cours ?"
    priority: 1
    material: true
    required_to_choose: true
    blocking: true
    reason: "May change the diagnostic strategy."
candidates:
  - id: ctp_a
    exam_name: Angioscanner des artères pulmonaires
    modality: CT
    contrast: yes
    appropriateness: context_dependent
rules:
  - id: PE_NO_IMAGING_LOW_INT_NEG_DDIMER
    if:
      all:
        - {field: current_problem.pe_pretest_probability, in: ["low", "intermediate"]}
        - {field: labs.d_dimer, equals: "negative"}
    result:
      no_imaging_recommended: true
      reason: "ACR: initial imaging is generally not appropriate for this variant."
