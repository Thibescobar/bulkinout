id: jaundice
version: 0.1.0
title: Jaundice / suspected biliary obstruction
status: needs_local_validation
sources:
  - organization: ACR
    title: Jaundice
    url: https://acsearch.acr.org/docs/69497/Narrative/
entry:
  any:
    - {field: current_problem.symptoms, contains_any: ["ictère", "jaundice"]}
    - {field: current_problem.indication, contains_any: ["ictère", "jaundice"]}
    - {field: current_problem.suspected_diagnosis, contains_any: ["obstruction biliaire", "biliary obstruction"]}
questions:
  - id: known_obstruction
    field: current_problem.mechanical_obstruction_suspected
    question: "Une obstruction mécanique est-elle déjà suspectée sur la clinique, la biologie ou une première imagerie ?"
    priority: 1
    material: true
    reason: "Distinguishes initial imaging from characterization of an obstruction."
  - id: prior_us
    field: current_problem.prior_biliary_ultrasound_result
    question: "Une échographie biliaire récente est-elle disponible et quel en est le résultat ?"
    priority: 2
    material: true
    reason: "May direct characterization toward MRCP or CT."
candidates:
  - id: us_abd
    exam_name: Échographie abdominale
    modality: US
    contrast: no
    appropriateness: usually_appropriate
  - id: mri_mrcp
    exam_name: IRM abdominale avec cholangio-IRM
    modality: MRI
    contrast: conditional
    appropriateness: usually_appropriate
  - id: ct_iv
    exam_name: TDM abdominale avec injection IV
    modality: CT
    contrast: yes
    appropriateness: usually_appropriate
