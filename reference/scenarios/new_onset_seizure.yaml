id: new_onset_seizure
version: 0.1.0
title: New-onset seizure
status: needs_local_validation
sources:
  - organization: ACR
    title: Seizures and Epilepsy
    url: https://acsearch.acr.org/docs/69479/Narrative
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains_any: ["crise comitiale", "seizure"]}
    - {field: current_problem.indication, contains_any: ["première crise", "first seizure"]}
    - {field: current_problem.indication, contains: "convulsion"}
questions:
  - id: trauma
    field: history.trauma
    answer_kind: boolean
    question: "La crise survient-elle dans un contexte traumatique récent ?"
    priority: 1
    material: true
    reason: "In a traumatic context, noncontrast head CT is particularly relevant initially."
  - id: first_seizure
    field: current_problem.first_seizure
    answer_kind: boolean
    question: "S'agit-il bien d'une première crise ?"
    priority: 1
    material: true
    reason: "Guidance differs from unchanged known epilepsy."
  - id: persistent_deficit
    field: current_problem.neurologic_deficit
    answer_kind: boolean
    question: "Déficit neurologique persistant ou altération prolongée ?"
    priority: 2
    material: true
    reason: "May affect urgency and the initial modality."
candidates:
  - id: mri_brain_wo
    exam_name: IRM cérébrale sans injection
    modality: MRI
    contrast: no
    appropriateness: usually_appropriate
  - id: ct_head_nc
    exam_name: TDM cérébrale sans injection
    modality: CT
    contrast: no
    appropriateness: usually_appropriate
