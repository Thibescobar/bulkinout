id: renal_colic
version: 0.1.0
title: Suspected renal colic / urinary stone disease
status: needs_local_validation
sources:
  - organization: ACR
    title: Acute Onset Flank Pain-Suspicion of Stone Disease (Urolithiasis)
    url: https://acsearch.acr.org/docs/69362/Narrative/
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains_any: ["colique", "renal colic"]}
    - {field: current_problem.suspected_diagnosis, contains_any: ["lithi", "urolith"]}
    - {field: current_problem.location, contains_any: ["flanc", "flank"]}
questions:
  - id: pregnancy
    field: imaging_safety.pregnancy
    question: "Une grossesse est-elle possible ou en cours ?"
    priority: 1
    material: true
    required_to_choose: true
    blocking: true
    reason: "Pregnancy changes the modality hierarchy."
  - id: prior_stone
    field: history.prior_urolithiasis
    question: "Lithiase connue ou imagerie récente documentant un calcul ?"
    priority: 3
    material: false
    reason: "May distinguish initial evaluation from follow-up."
candidates:
  - id: ct_noncontrast
    exam_name: TDM abdomen-pelvis sans injection
    modality: CT
    contrast: no
    appropriateness: usually_appropriate
    when:
      all:
        - {field: imaging_safety.pregnancy, not_equals: true}
  - id: renal_ultrasound
    exam_name: Échographie réno-vésicale
    modality: US
    contrast: no
    appropriateness: usually_appropriate
    when:
      all:
        - {field: imaging_safety.pregnancy, equals: true}
notes:
  - "The reference encodes modality hierarchy, not local technical dose parameters."
