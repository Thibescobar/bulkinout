id: renal_colic
version: 0.1.0
title: Suspicion de colique néphrétique / lithiase urinaire
status: needs_local_validation
sources:
  - organization: ACR
    title: Acute Onset Flank Pain-Suspicion of Stone Disease (Urolithiasis)
    url: https://acsearch.acr.org/docs/69362/Narrative/
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains: "colique"}
    - {field: current_problem.suspected_diagnosis, contains: "lithi"}
    - {field: current_problem.location, contains: "flanc"}
questions:
  - id: pregnancy
    field: imaging_safety.pregnancy
    question: "Une grossesse est-elle possible ou en cours ?"
    priority: 1
    material: true
    reason: "La grossesse modifie la hiérarchie des modalités."
  - id: prior_stone
    field: history.prior_urolithiasis
    question: "Lithiase connue ou imagerie récente documentant un calcul ?"
    priority: 3
    material: false
    reason: "Peut modifier le contexte initial vs suivi."
candidates:
  - id: ct_noncontrast
    exam_name: TDM abdomen-pelvis sans injection
    modality: CT
    contrast: no
    appropriateness: usually_appropriate
    when:
      all:
        - {field: imaging_safety.pregnancy, not_equals: true}
  - id: renal_ultrasound
    exam_name: Échographie réno-vésicale
    modality: US
    contrast: no
    appropriateness: usually_appropriate
    when:
      all:
        - {field: imaging_safety.pregnancy, equals: true}
notes:
  - "Le référentiel encode la hiérarchie de modalité, pas les paramètres techniques locaux de dose."
