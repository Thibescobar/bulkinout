id: suspected_spine_infection
version: 0.1.0
title: Suspected spine infection / spondylodiscitis / epidural abscess
status: needs_local_validation
sources:
  - organization: ACR
    title: Suspected Spine Infection
    url: https://acsearch.acr.org/docs/3148734/Narrative/
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains: "spondylodisc"}
    - {field: current_problem.suspected_diagnosis, contains_any: ["abcès épidural", "epidural abscess"]}
    - {field: current_problem.suspected_diagnosis, contains_any: ["infection rachid", "spinal infection"]}
questions:
  - id: region
    field: current_problem.location
    question: "Quelle région rachidienne est symptomatique ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "Determines the spinal region to cover with MRI."
  - id: neuro_deficit
    field: current_problem.neurologic_deficit
    answer_kind: boolean
    question: "Déficit neurologique nouveau ou syndrome de la queue de cheval ?"
    priority: 1
    material: true
    reason: "Increases urgency and the need to assess epidural extension."
  - id: recent_intervention
    field: history.recent_spine_intervention
    answer_kind: boolean
    question: "Chirurgie, infiltration ou implantation de matériel rachidien récente ?"
    priority: 2
    material: true
    reason: "Provides important scenario context."
candidates:
  - id: mri_spine_wwo
    exam_name: IRM du rachis symptomatique sans et avec injection
    modality: MRI
    contrast: yes
    appropriateness: usually_appropriate
  - id: mri_spine_wo
    exam_name: IRM du rachis symptomatique sans injection
    modality: MRI
    contrast: no
    appropriateness: usually_appropriate
