id: acute_pancreatitis
version: 0.1.0
title: Suspected acute pancreatitis
status: needs_local_validation
sources:
  - organization: ACR
    title: Acute Pancreatitis
    url: https://acsearch.acr.org/docs/69468/Narrative
entry:
  any:
    - {field: current_problem.suspected_diagnosis, contains_any: ["pancréatite", "pancreatitis"]}
    - {field: current_problem.known_diagnosis, contains_any: ["pancréatite", "pancreatitis"]}
questions:
  - id: onset
    field: current_problem.onset
    question: "Depuis combien de temps les symptômes évoluent-ils ?"
    priority: 1
    material: true
    reason: "Timing before or after 48–72 hours affects the value of initial cross-sectional imaging."
  - id: enzymes
    field: labs.lipase
    question: "Lipase/amylase compatibles avec une pancréatite ?"
    priority: 1
    material: true
    reason: "A typical presentation with elevated enzymes differs from an atypical presentation."
  - id: atypical
    field: current_problem.atypical_presentation
    question: "La présentation est-elle atypique ou existe-t-il un diagnostic alternatif important ?"
    priority: 1
    material: true
    reason: "May justify early cross-sectional imaging."
candidates:
  - id: us_abd
    exam_name: Échographie abdominale
    modality: US
    contrast: no
    appropriateness: usually_appropriate
  - id: ct_iv
    exam_name: TDM abdomino-pelvienne avec injection IV
    modality: CT
    contrast: yes
    appropriateness: context_dependent
  - id: mri_mrcp
    exam_name: IRM abdominale avec cholangio-IRM
    modality: MRI
    contrast: conditional
    appropriateness: context_dependent
