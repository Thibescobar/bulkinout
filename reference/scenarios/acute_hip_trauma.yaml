id: acute_hip_trauma
version: 0.1.0
title: Acute traumatic hip pain / suspected occult fracture
status: needs_local_validation
sources:
  - organization: ACR
    title: Acute Hip Pain
    url: https://acsearch.acr.org/docs/3082587/Narrative/
entry:
  all:
    - {field: current_problem.location, contains_any: ["hanche", "hip"]}
    - {field: history.trauma, contains_any: ["trauma", "traumatisme"]}
questions:
  - id: prior_xray
    field: current_problem.prior_hip_radiograph_result
    question: "Des radiographies de hanche ont-elles déjà été réalisées et sont-elles négatives/indéterminées ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "Initial imaging and the next step differ."
  - id: suspected_fracture
    field: current_problem.suspected_fracture
    question: "La suspicion clinique de fracture reste-t-elle forte malgré les radiographies ?"
    priority: 1
    material: true
    reason: "Determines whether MRI or CT is appropriate."
candidates:
  - id: hip_xray
    exam_name: Radiographies de hanche
    modality: XRAY
    contrast: no
    appropriateness: usually_appropriate
  - id: hip_mri
    exam_name: IRM de hanche sans injection
    modality: MRI
    contrast: no
    appropriateness: usually_appropriate_after_negative_xray
  - id: hip_ct
    exam_name: TDM de hanche sans injection
    modality: CT
    contrast: no
    appropriateness: usually_appropriate_after_negative_xray
