id: low_back_pain
version: 0.1.0
title: Lombalgie aiguë / lomboradiculalgie
status: needs_local_validation
sources:
  - organization: ACR
    title: Low Back Pain
    url: https://acsearch.acr.org/docs/69483/Narrative/
entry:
  any:
    - {field: current_problem.location, contains: "lomb"}
    - {field: current_problem.indication, contains: "lombalg"}
questions:
  - id: red_flags
    field: current_problem.red_flags
    question: "Existe-t-il un red flag (cancer, infection, traumatisme, déficit neurologique, syndrome de la queue de cheval, immunodépression, etc.) ?"
    priority: 1
    material: true
    reason: "Une lombalgie aiguë sans red flag ne justifie généralement pas d'imagerie initiale."
  - id: trauma_osteoporosis
    field: current_problem.fracture_risk
    question: "Traumatisme, ostéoporose, âge avancé ou corticothérapie chronique ?"
    priority: 1
    material: true
    reason: "Peut orienter vers radiographies, TDM ou IRM."
  - id: prior_surgery
    field: history.prior_spine_surgery
    question: "Chirurgie lombaire antérieure avec symptômes nouveaux ou progressifs ?"
    priority: 2
    material: true
    reason: "Modifie le choix de l'imagerie."
candidates:
  - id: no_imaging
    exam_name: Pas d'imagerie initiale
    modality: NONE
    contrast: no
    appropriateness: usually_appropriate_if_no_red_flags
  - id: mri_lumbar
    exam_name: IRM lombaire
    modality: MRI
    contrast: conditional
    appropriateness: context_dependent
  - id: ct_lumbar
    exam_name: TDM lombaire sans injection
    modality: CT
    contrast: no
    appropriateness: context_dependent
  - id: xray_lumbar
    exam_name: Radiographies lombaires
    modality: XRAY
    contrast: no
    appropriateness: context_dependent
rules:
  - id: LBP_NO_RED_FLAGS
    if:
      all:
        - {field: current_problem.red_flags, equals: false}
    result:
      no_imaging_recommended: true
      reason: "ACR: imagerie initiale généralement non appropriée en l'absence de red flags."
