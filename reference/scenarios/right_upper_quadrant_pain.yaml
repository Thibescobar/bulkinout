id: right_upper_quadrant_pain
version: 0.1.0
title: Right upper quadrant pain / suspected biliary disease
status: needs_local_validation
sources:
  - organization: ACR
    title: Right Upper Quadrant Pain
    url: https://acsearch.acr.org/docs/69474/Narrative/
entry:
  any:
    - {field: current_problem.location, contains_any: ["hypochondre droit", "right hypochondrium"]}
    - {field: current_problem.location, contains_any_term: ["quadrant supérieur droit", "right upper quadrant", "RUQ"]}
    - {field: current_problem.suspected_diagnosis, contains_any: ["cholécystite", "cholecystitis"]}
questions:
  - id: biliary_suspicion
    field: current_problem.biliary_disease_suspected
    question: "La présentation oriente-t-elle vers une pathologie biliaire ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "Ultrasound is the preferred initial examination when biliary disease is suspected."
  - id: prior_us
    field: current_problem.ultrasound_equivocal_or_negative
    question: "Une échographie a-t-elle déjà été réalisée et est-elle négative/équivoque ?"
    priority: 1
    material: true
    required_to_choose: true
    reason: "Determines the next imaging step."
  - id: fever_wbc
    field: current_problem.fever_or_leukocytosis
    question: "Fièvre ou hyperleucocytose ?"
    priority: 2
    material: true
    reason: "Distinguishes variants after a negative or equivocal ultrasound."
candidates:
  - id: us_abd
    exam_name: Échographie abdominale ciblée hépatobiliaire
    modality: US
    contrast: no
    appropriateness: usually_appropriate
  - id: ct_iv
    exam_name: TDM abdominale avec injection IV
    modality: CT
    contrast: yes
    appropriateness: context_dependent
  - id: mri_mrcp
    exam_name: IRM abdominale avec cholangio-IRM
    modality: MRI
    contrast: conditional
    appropriateness: context_dependent
