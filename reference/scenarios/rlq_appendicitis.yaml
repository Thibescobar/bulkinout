id: rlq_appendicitis
version: 0.1.0
title: Right lower quadrant pain / suspected appendicitis
status: needs_local_validation
sources:
  - organization: ACR
    title: Right Lower Quadrant Pain
    url: https://acsearch.acr.org/docs/69357/Narrative/
entry:
  any:
    - {field: current_problem.location, contains_any_term: ["fosse iliaque droite", "right lower quadrant", "RLQ"]}
    - {field: current_problem.suspected_diagnosis, contains: "appendic"}
questions:
  - id: pregnancy
    field: imaging_safety.pregnancy
    answer_kind: boolean
    question: "Une grossesse est-elle possible ou en cours ?"
    priority: 1
    material: true
    required_to_choose: true
    blocking: true
    reason: "May change the imaging strategy."
  - id: fever
    field: current_problem.fever
    answer_kind: boolean
    question: "Fièvre présente ?"
    priority: 2
    material: false
    reason: "Supports an infectious or inflammatory scenario."
  - id: leukocytosis
    field: labs.leukocytosis
    answer_kind: boolean
    question: "Hyperleucocytose documentée ?"
    priority: 3
    material: false
    reason: "Completes the suspected appendicitis context."
candidates:
  - id: ct_iv
    exam_name: TDM abdomino-pelvienne avec injection IV
    modality: CT
    contrast: yes
    appropriateness: usually_appropriate
