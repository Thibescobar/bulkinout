id: llq_diverticulitis
version: 0.1.0
title: Left lower quadrant pain / suspected diverticulitis
status: needs_local_validation
sources:
  - organization: ACR
    title: Left Lower Quadrant Pain
    url: https://acsearch.acr.org/docs/69356/Narrative/
entry:
  any:
    - {field: current_problem.location, contains_any_term: ["fosse iliaque gauche", "left lower quadrant", "LLQ"]}
    - {field: current_problem.suspected_diagnosis, contains: "diverticul"}
questions:
  - id: complication
    field: current_problem.suspected_complication
    question: "Y a-t-il des signes faisant suspecter une complication (péritonite, abcès, sepsis, occlusion) ?"
    priority: 1
    material: true
    reason: "Suspected complications refine the objective and protocol."
  - id: pregnancy
    field: imaging_safety.pregnancy
    question: "Une grossesse est-elle possible ou en cours ?"
    priority: 1
    material: true
    required_to_choose: true
    blocking: true
    reason: "May change the imaging strategy."
candidates:
  - id: ct_iv
    exam_name: TDM abdomino-pelvienne avec injection IV
    modality: CT
    contrast: yes
    appropriateness: usually_appropriate
