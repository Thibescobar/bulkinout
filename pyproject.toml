[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkinout"
version = "0.0.0"
description = "Bulkinout: Bulk in. Intelligence out. Multimodal clinical structuring engine with radiology workflows."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyMuPDF>=1.24,<2",
  "openai>=1.50",
  "PyYAML>=6,<7",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13,<1",
  "Pillow>=10,<12",
]
dev = [
  "build>=1.3,<2",
  "mypy==1.20.2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff==0.16.6",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
bulkinout = "bulkinout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=bulkinout --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["bulkinout"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
