[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkinout"
version = "0.0.0"
description = "BULKINOUT: Bulk in. Intelligence out. Multimodal clinical structuring engine with radiology workflows."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyMuPDF>=1.24,<2",
  "openai>=1.50",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.13,<1",
  "Pillow>=10,<12",
]
dev = ["pytest>=8,<9"]

[project.scripts]
bulkinout = "bulkinout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
