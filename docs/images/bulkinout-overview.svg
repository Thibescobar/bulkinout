<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Bulkinout workflow overview</title>
  <desc id="desc">Clinical documents become a structured radiology case. Core feeds the active Request workflow and the future Report workflow. After Request, new images, acquisition data, and measurements also feed Report. AI stamps identify model-assisted stages.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14a8a1"/>
      <stop offset="0.58" stop-color="#f2a23a"/>
      <stop offset="1" stop-color="#e35b50"/>
    </linearGradient>
    <linearGradient id="softBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8f6"/>
      <stop offset="1" stop-color="#fff2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#34454d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#45aaa4"/>
    </marker>
  </defs>

  <rect width="1400" height="470" rx="24" fill="#ffffff"/>
  <rect width="1400" height="8" rx="4" fill="url(#brand)"/>
  <circle cx="1315" cy="36" r="125" fill="#f2a23a" opacity="0.07"/>
  <circle cx="70" cy="470" r="165" fill="#14a8a1" opacity="0.06"/>

  <text x="55" y="70" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Bulk in. Intelligence out.</text>
  <text x="55" y="104" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">From heterogeneous clinical documents to an auditable radiology workflow.</text>

  <g filter="url(#shadow)">
    <rect x="45" y="155" width="270" height="190" rx="18" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <rect x="70" y="190" width="52" height="66" rx="7" fill="#eef9f8" stroke="#14a8a1" stroke-width="2"/>
    <path d="M83 210h26M83 223h26M83 236h18" stroke="#14a8a1" stroke-width="3" stroke-linecap="round"/>
    <rect x="106" y="211" width="52" height="66" rx="7" fill="#fff5eb" stroke="#f2a23a" stroke-width="2"/>
    <path d="M119 231h26M119 244h26M119 257h18" stroke="#f2a23a" stroke-width="3" stroke-linecap="round"/>
    <text x="175" y="214" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Clinical input</text>
    <text x="175" y="242" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">PDF · TXT · images</text>
    <text x="70" y="316" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Multilingual · source-grounded</text>
  </g>

  <path d="M333 250H355" stroke="#45aaa4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="375" y="155" width="320" height="190" rx="18" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <rect x="375" y="155" width="320" height="6" rx="3" fill="url(#brand)"/>
    <rect x="405" y="188" width="58" height="58" rx="14" fill="url(#softBrand)"/>
    <path d="M421 205h26M421 217h26M421 229h17" stroke="#d06f4a" stroke-width="3" stroke-linecap="round"/>
    <text x="485" y="214" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Bulkinout Core</text>
    <g transform="rotate(-6 659 188)">
      <rect x="641" y="176" width="36" height="24" rx="5" fill="#ffffff" stroke="#e35b50" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="659" y="193" fill="#e35b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
    </g>
    <text x="405" y="278" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Structured RadiologyCase</text>
    <text x="405" y="307" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Canonical data · provenance · audit</text>
  </g>

  <path d="M713 218H755" stroke="#45aaa4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M713 296H735 Q755 296 755 316V377 Q755 397 775 397H1065" stroke="#45aaa4" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="775" y="155" width="270" height="125" rx="16" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <circle cx="810" cy="210" r="14" fill="#14a8a1"/>
    <path d="M804 210l5 5 9-11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="839" y="194" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Request</text>
    <text x="839" y="218" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Available in v0</text>
    <rect x="839" y="230" width="190" height="22" rx="11" fill="#fff5eb" stroke="#f2a23a" stroke-width="1"/>
    <text x="934" y="244.5" fill="#a86124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Aided imaging protocol proposal</text>
    <g transform="rotate(-6 1013 177)">
      <rect x="995" y="165" width="36" height="24" rx="5" fill="#ffffff" stroke="#e35b50" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="1013" y="182" fill="#e35b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
    </g>
  </g>

  <path d="M910 288V302" stroke="#45aaa4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="785" y="312" width="240" height="48" rx="24" fill="#eef9f8" stroke="#45aaa4" stroke-width="1.3"/>
    <circle cx="811" cy="336" r="12" fill="#ffffff" stroke="#14a8a1" stroke-width="1.5"/>
    <path d="M805 339l4-6 4 4 4-7" stroke="#14a8a1" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="832" y="331" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700">Post-request evidence</text>
    <text x="832" y="348" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Images · acquisition data · measurements</text>
  </g>

  <path d="M1043 336H1065" stroke="#45aaa4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1085" y="305" width="270" height="125" rx="16" fill="#fafafa" stroke="#e2e7e8" stroke-width="1.5"/>
    <circle cx="1120" cy="360" r="14" fill="#f2a23a"/>
    <path d="M1114 360h12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="1149" y="344" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Report</text>
    <text x="1149" y="368" fill="#858a8d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Standby</text>
    <rect x="1149" y="380" width="192" height="22" rx="11" fill="#fff5eb" stroke="#f2a23a" stroke-width="1"/>
    <text x="1245" y="394.5" fill="#a86124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.6" font-weight="700" text-anchor="middle">Aided Radiological and clinical reporting</text>
    <g transform="rotate(-6 1323 327)">
      <rect x="1305" y="315" width="36" height="24" rx="5" fill="#ffffff" stroke="#e35b50" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="1323" y="332" fill="#e35b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
    </g>
  </g>

  <circle cx="1330" cy="70" r="7" fill="#e35b50"/>
  <path d="M1330 57v26M1317 70h26" stroke="#e35b50" stroke-width="4" stroke-linecap="round"/>
</svg>
