<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Bulkinout workflow overview</title>
  <desc id="desc">Clinical documents become a structured radiology case that feeds the active Request workflow and the future Report workflow. AI stamps identify model-assisted stages.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14a8a1"/>
      <stop offset="0.58" stop-color="#f2a23a"/>
      <stop offset="1" stop-color="#e35b50"/>
    </linearGradient>
    <linearGradient id="softBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8f6"/>
      <stop offset="1" stop-color="#fff2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#34454d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#45aaa4"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#ffffff"/>
  <rect width="1200" height="8" rx="4" fill="url(#brand)"/>
  <circle cx="1115" cy="35" r="120" fill="#f2a23a" opacity="0.07"/>
  <circle cx="75" cy="420" r="155" fill="#14a8a1" opacity="0.06"/>

  <text x="60" y="70" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Bulk in. Intelligence out.</text>
  <text x="60" y="104" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">From heterogeneous clinical documents to an auditable radiology workflow.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="280" height="184" rx="18" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <rect x="82" y="183" width="55" height="69" rx="7" fill="#eef9f8" stroke="#14a8a1" stroke-width="2"/>
    <path d="M96 204h27M96 217h27M96 230h19" stroke="#14a8a1" stroke-width="3" stroke-linecap="round"/>
    <rect x="120" y="205" width="55" height="69" rx="7" fill="#fff5eb" stroke="#f2a23a" stroke-width="2"/>
    <path d="M134 226h27M134 239h27M134 252h19" stroke="#f2a23a" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="210" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Clinical input</text>
    <text x="190" y="239" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">PDF · TXT · images</text>
    <text x="82" y="307" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Multilingual · source-grounded</text>
  </g>

  <path d="M351 242H405" stroke="#45aaa4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="425" y="150" width="325" height="184" rx="18" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <rect x="425" y="150" width="325" height="6" rx="3" fill="url(#brand)"/>
    <rect x="455" y="181" width="58" height="58" rx="14" fill="url(#softBrand)"/>
    <path d="M471 198h26M471 210h26M471 222h17" stroke="#d06f4a" stroke-width="3" stroke-linecap="round"/>
    <text x="535" y="207" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Bulkinout Core</text>
    <g transform="rotate(-6 716 184)">
      <rect x="698" y="172" width="36" height="24" rx="5" fill="#ffffff" stroke="#e35b50" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="716" y="189" fill="#e35b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
    </g>
    <text x="455" y="270" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Structured RadiologyCase</text>
    <text x="455" y="299" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Canonical data · provenance · audit</text>
  </g>

  <path d="M768 242H815 Q832 242 832 225V210 Q832 198 845 198H865" stroke="#45aaa4" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M768 242H815 Q832 242 832 259V290 Q832 302 845 302H865" stroke="#45aaa4" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="883" y="146" width="262" height="108" rx="16" fill="#ffffff" stroke="#e2e7e8" stroke-width="1.5"/>
    <circle cx="918" cy="199" r="14" fill="#14a8a1"/>
    <path d="M912 199l5 5 9-11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="947" y="187" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Request</text>
    <text x="947" y="211" fill="#70767a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Available in v0</text>
    <rect x="947" y="220" width="184" height="20" rx="10" fill="#fff5eb" stroke="#f2a23a" stroke-width="1"/>
    <text x="1039" y="233.5" fill="#a86124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Aided imaging protocol proposal</text>
    <g transform="rotate(-6 1113 172)">
      <rect x="1095" y="160" width="36" height="24" rx="5" fill="#ffffff" stroke="#e35b50" stroke-width="1.6" stroke-dasharray="3 2"/>
      <text x="1113" y="177" fill="#e35b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
    </g>

    <rect x="883" y="268" width="262" height="105" rx="16" fill="#fafafa" stroke="#e2e7e8" stroke-width="1.5"/>
    <circle cx="918" cy="303" r="14" fill="#f2a23a"/>
    <path d="M912 303h12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="947" y="298" fill="#47484b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Report</text>
    <text x="947" y="322" fill="#858a8d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Standby</text>
    <rect x="947" y="336" width="184" height="20" rx="10" fill="#fff5eb" stroke="#f2a23a" stroke-width="1"/>
    <text x="1039" y="349.5" fill="#a86124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8.6" font-weight="700" text-anchor="middle">Aided radiological and clinical reporting</text>
  </g>

  <circle cx="1131" cy="70" r="7" fill="#e35b50"/>
  <path d="M1131 57v26M1118 70h26" stroke="#e35b50" stroke-width="4" stroke-linecap="round"/>
</svg>
